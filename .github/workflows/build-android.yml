name: Build Server Control APK

on:
  workflow_dispatch:
  push:
    branches: [claude/sotf-server-setup-llure1]
    paths: ['sotf/android/**', '.github/workflows/build-android.yml']

# Needed to publish the release the app updates itself from.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sotf/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repo carries no wrapper jar, so generate one pinned to the
      # version the build scripts expect.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      # Android refuses an update signed with a different key than the
      # installed app, and the runner mints a fresh debug keystore on
      # every run. Without this the in-app updater can never install
      # anything — each build looks like a foreign app.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
          else
            # A silent fallback would publish a release nobody can install
            # as an update, so say it out loud in the job log.
            echo "::warning::KEYSTORE_BASE64 secret missing - built with the runner's throwaway debug key. This APK cannot be installed as an update over an existing install."
          fi

      # The run number becomes versionCode, so releases are strictly
      # ordered and the app can tell "newer" from "same".
      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/server-control-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: server-control-debug
          path: sotf/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The app checks this release to offer in-app updates, so it only
      # makes sense for real pushes — not for manual test runs.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v0.2.0-${{ github.run_number }}
          name: Server Control 0.2.0 (Build ${{ github.run_number }})
          body: |
            Automatischer Build von ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: sotf/android/app/build/outputs/apk/debug/*.apk
          make_latest: true
