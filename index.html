<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KevWorkdesk powered by CCOne</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="top-bar">
        <button class="edit-mode-toggle" id="editToggle">Edit Mode</button>
        <div id="navButtons"></div>
        <button class="add-button" id="addBtn">+ Add</button>
    </div>
    <div class="notes-bar" id="notesBar"></div>
    <div class="main-content">
        <div class="calc-toggle" id="calcToggle">CALC</div>
        <div class="datecalc-toggle" id="dateCalcToggle">DatumCalc</div>
        <div class="avg-toggle" id="avgToggle">Ø</div>
        <div class="widget-bar">
            <div class="timer-widget" id="timerWidget">
                <div id="timerBadge" class="timer-badge">0</div>
                <div class="timer-label">TIMER</div>
            </div>
        </div>
        <div class="content-wrapper">
            <div class="calculator-widget" id="calculator">
                <div class="calc-header">
                    <button class="calc-history-toggle" onclick="toggleCalcHistory()">📜 Verlauf</button>
                </div>
                <div class="calc-history" id="calcHistory" style="display:none;">
                    <div class="calc-history-empty">Keine Rechnungen</div>
                </div>
                <div class="calc-display" id="calcDisplay">0</div>
                <div class="calc-buttons">
                    <button class="calc-btn clear">C</button>
                    <button class="calc-btn operator">⌫</button>
                    <button class="calc-btn operator">/</button>
                    <button class="calc-btn operator">×</button>
                    <button class="calc-btn">7</button>
                    <button class="calc-btn">8</button>
                    <button class="calc-btn">9</button>
                    <button class="calc-btn operator">−</button>
                    <button class="calc-btn">4</button>
                    <button class="calc-btn">5</button>
                    <button class="calc-btn">6</button>
                    <button class="calc-btn operator">+</button>
                    <button class="calc-btn">1</button>
                    <button class="calc-btn">2</button>
                    <button class="calc-btn">3</button>
                    <button class="calc-btn">0</button>
                    <button class="calc-btn">.</button>
                    <button class="calc-btn equals">=</button>
                </div>
            </div>
            <div class="input-section">
                <div class="input-container">
                    <textarea class="input-box" id="noteInput" placeholder="Type your note here..."></textarea>
                    <button class="submit-button" id="createBtn">Create Note</button>
                </div>
                <div class="dashboard-info">
                    <button class="time-toggle" id="timeToggle" title="Uhrzeit ein-/ausblenden">👁</button>
                    <div class="dashboard-title">KevWorkdesk powered by CCOne</div>
                    <div class="dashboard-time" id="dashTime">00:00:00</div>
                    <div class="dashboard-date" id="dashDate">Loading...</div>
                </div>
                <div class="offers-section">
                    <div class="offers-header">
                        <div class="offers-title">Angebote</div>
                        <button class="add-offer-btn" id="addOfferBtn">+ Angebot</button>
                    </div>
                    <div id="offersTableContainer"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="active-timers-display" id="activeTimersDisplay">
        <div class="active-timers-header">Aktive Timer</div>
        <div id="activeTimersList"></div>
    </div>
    <div class="expired-timers-modal" id="expiredTimersModal">
        <div class="expired-timers-header">⏰ Timer abgelaufen!</div>
        <div id="expiredTimersList"></div>
        <button class="dismiss-all-expired-btn" id="dismissAllExpiredBtn">Alle schließen</button>
    </div>
    <div class="files-display-section" id="filesDisplay"></div>
    <div class="bottom-bar">
        <div class="bottom-bar-header" id="fileHeader">
            <span>Upload Files</span>
            <span class="arrow" id="uploadArrow">▼</span>
        </div>
        <div class="upload-section" id="uploadSection">
            <div class="upload-content">
                <div class="upload-area" id="uploadArea">
                    <button class="upload-button">Choose PDF, PNG or JPG</button>
                    <p style="margin-top:0.5rem;color:#888;font-size:0.9rem">or drag and drop files here</p>
                </div>
                <input type="file" id="fileInput" class="file-input" accept=".pdf,.png,.jpg,.jpeg" multiple>
            </div>
        </div>
    </div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div id="modalTitleContainer" style="flex:1"><h2 class="modal-title" id="modalTitle"></h2></div>
                <button class="close-button" id="closeBtn">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- JavaScript Modules - Load order matters! -->
    <!-- Config first -->
    <script src="js/config.js"></script>

    <!-- Core modules -->
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>

    <!-- Feature modules -->
    <script src="js/calculator.js"></script>
    <script src="js/dateCalculator.js"></script>
    <script src="js/averageCalculator.js"></script>

    <!-- Timer modules (notifications → core → ui) -->
    <script src="js/timer-notifications.js"></script>
    <script src="js/timer-core.js"></script>
    <script src="js/timer-ui.js"></script>

    <!-- Other features -->
    <script src="js/offers.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/buttons.js"></script>
    <script src="js/files.js"></script>

    <!-- Main init last -->
    <script src="js/main.js"></script>
</body>
</html>
