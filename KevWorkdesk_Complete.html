<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KevWorkdesk powered by CCOne</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            background: rgba(40, 40, 60, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(220, 60, 60, 0.2);
            flex-wrap: wrap;
            position: relative;
        }
        .edit-mode-toggle {
            position: absolute;
            right: 1.5rem;
            padding: 0.6rem 1rem;
            background: rgba(60, 60, 80, 0.6);
            border: 1px solid rgba(220, 60, 60, 0.3);
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
       }
        .edit-mode-toggle:hover { background: rgba(220, 60, 60, 0.2); border-color: #dc3c3c; }
        .edit-mode-toggle.active { background: rgba(220, 60, 60, 0.3); border-color: #dc3c3c; box-shadow: 0 0 10px rgba(220, 60, 60, 0.3); }
        .nav-button-container { position: relative; display: inline-block; }
        body.edit-mode .nav-button-container { cursor: grab; }
        body.edit-mode .nav-button-container:active { cursor: grabbing; }
        .nav-button {
            padding: 0.6rem 1.5rem;
            background: rgba(60, 60, 80, 0.6);
            border: 1px solid rgba(220, 60, 60, 0.3);
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-block;
        }
        .nav-button:hover { background: rgba(220, 60, 60, 0.2); border-color: #dc3c3c; transform: translateY(-2px); }
        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            background: #b43232;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        body.edit-mode .delete-btn { display: flex; }
        .delete-btn:hover { background: #dc3c3c; }
        .add-button {
            padding: 0.6rem 1.5rem;
            background: rgba(60, 180, 60, 0.2);
            border: 1px solid rgba(60, 180, 60, 0.5);
            color: #5cb85c;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            display: none;
        }
        body.edit-mode .add-button, .add-button.show-always { display: inline-block; }
        .add-button:hover { background: rgba(60, 180, 60, 0.3); transform: translateY(-2px); }
        .notes-bar {
            background: rgba(40, 40, 60, 0.7);
            padding: 0.8rem;
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            min-height: 50px;
            align-items: center;
            border-bottom: 1px solid rgba(220, 60, 60, 0.2);
        }
        .notes-bar:empty::after { content: 'No notes yet - create one below'; color: #888; font-size: 0.9rem; }
        .note-button-container {
            position: relative;
            display: inline-block;
            cursor: grab;
        }
        .note-button-container:active {
            cursor: grabbing;
        }
        .note-button {
            padding: 0.5rem 1rem;
            background: rgba(220, 60, 60, 0.2);
            border: 1px solid #dc3c3c;
            color: #dc3c3c;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-weight: 600;
        }
        .note-button:hover { background: rgba(220, 60, 60, 0.4); transform: scale(1.05); }
        .note-delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            background: #b43232;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 14px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        body.edit-mode .note-delete-btn { display: flex; }
        .note-delete-btn:hover { background: #dc3c3c; }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }
        .widget-bar {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
        }
        .timer-widget {
            background: rgba(40, 40, 60, 0.9);
            border: 1px solid rgba(220, 60, 60, 0.3);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .timer-widget:hover { background: rgba(50, 50, 70, 0.9); border-color: #dc3c3c; transform: translateY(-2px); }
        .timer-label {
            font-size: 0.9rem;
            color: #aaa;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .timer-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #dc3c3c;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            border: 2px solid rgba(40, 40, 60, 0.9);
        }
        .timer-badge.active { display: flex; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .content-wrapper {
            display: flex;
            gap: 2rem;
            width: 100%;
            max-width: 1400px;
            align-items: flex-start;
            justify-content: center;
        }
        .calculator-widget {
            background: rgba(40, 40, 60, 0.9);
            border: 1px solid rgba(220, 60, 60, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            display: none;
            flex-direction: column;
            gap: 1rem;
            min-width: 280px;
        }
        .calculator-widget.active { display: flex; }
        .calc-toggle, .datecalc-toggle, .avg-toggle {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: rgba(40, 40, 60, 0.9);
            border: 1px solid rgba(220, 60, 60, 0.3);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            font-size: 0.9rem;
            color: #aaa;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .datecalc-toggle {
            top: 6rem;
        }
        .avg-toggle {
            top: 10rem;
        }
        .calc-toggle:hover, .datecalc-toggle:hover, .avg-toggle:hover { background: rgba(50, 50, 70, 0.9); border-color: #dc3c3c; transform: translateY(-2px); }
        .calc-toggle.active, .datecalc-toggle.active, .avg-toggle.active { background: rgba(220, 60, 60, 0.2); border-color: #dc3c3c; color: #dc3c3c; }
        .calc-display {
            background: rgba(30, 30, 45, 0.8);
            border: 1px solid rgba(220, 60, 60, 0.3);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: right;
            font-size: 2rem;
            font-weight: 700;
            color: #e0e0e0;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-break: break-all;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
        }
        .calc-btn {
            padding: 1.2rem;
            background: rgba(60, 60, 80, 0.6);
            border: 1px solid rgba(220, 60, 60, 0.3);
            color: #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .calc-btn:hover { background: rgba(220, 60, 60, 0.2); border-color: #dc3c3c; transform: scale(1.05); }
        .calc-btn:active { transform: scale(0.95); }
        .calc-btn.operator { background: rgba(220, 60, 60, 0.2); color: #dc3c3c; }
        .calc-btn.equals { background: linear-gradient(135deg, #dc3c3c 0%, #b82e2e 100%); color: white; grid-column: span 2; }
        .calc-btn.clear { background: rgba(180, 50, 50, 0.2); color: #b43232; }
        .calc-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
        }
        .calc-history-toggle {
            background: rgba(60, 60, 80, 0.6);
            border: 1px solid rgba(220, 60, 60, 0.3);
            color: #e0e0e0;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .calc-history-toggle:hover { background: rgba(220, 60, 60, 0.2); }
        .calc-history {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(30, 30, 45, 0.8);
            border: 1px solid rgba(220, 60, 60, 0.3);
            border-radius: 8px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .calc-history-item {
            padding: 0.4rem;
            color: #aaa;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(220, 60, 60, 0.1);
        }
        .calc-history-item:last-child { border-bottom: none; }
        .calc-history-empty {
            padding: 0.4rem;
            color: #666;
            font-size: 0.9rem;
            font-style: italic;
            text-align: center;
        }
        .input-section { width: 100%; max-width: 700px; }
        .input-container {
            background: rgba(40, 40, 60, 0.9);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(220, 60, 60, 0.2);
        }
        .input-box {
            width: 100%;
            min-height: 60px;
            background: rgba(30, 30, 45, 0.8);
            border: 1px solid rgba(220, 60, 60, 0.3);
            border-radius: 8px;
            padding: 1rem;
            color: #e0e0e0;
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
        }
        .input-box:focus { outline: none; border-color: #dc3c3c; }
        .submit-button {
            margin-top: 0.8rem;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #dc3c3c 0%, #b82e2e 100%);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }
        .submit-button:hover { transform: translateY(-2px); }
        .dashboard-info {
            margin-top: 1rem;
            text-align: center;
            padding: 1rem;
            background: rgba(40, 40, 60, 0.7);
            border-radius: 8px;
            border: 1px solid rgba(220, 60, 60, 0.2);
            position: relative;
        }
        .dashboard-title {
            color: #dc3c3c;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .dashboard-time {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e0e0e0;
            margin: 0.5rem 0;
        }
        .dashboard-time.hidden {
            color: #555;
            user-select: none;
        }
        .dashboard-date {
            color: #aaa;
            font-size: 0.95rem;
        }
        .time-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            padding: 0.3rem;
        }
        .time-toggle:hover {
            color: #dc3c3c;
            transform: scale(1.1);
        }
        .offers-section {
            width: 100%;
            max-width: 700px;
            margin-top: 1rem;
            background: rgba(40, 40, 60, 0.9);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(220, 60, 60, 0.2);
        }
        .offers-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .offers-title {
            color: #dc3c3c;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .add-offer-btn {
            padding: 0.5rem 1rem;
            background: rgba(60, 180, 60, 0.2);
            border: 1px solid rgba(60, 180, 60, 0.5);
            color: #5cb85c;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            display: none;
        }
        body.edit-mode .add-offer-btn, .add-offer-btn.show-always { display: inline-block; }
        .add-offer-btn:hover { background: rgba(60, 180, 60, 0.3); transform: scale(1.05); }
        #offersTableContainer {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .offers-table {
            width: 100%;
            border-collapse: collapse;
        }
        .offers-table thead th {
            background: rgba(220, 60, 60, 0.2);
            color: #dc3c3c;
            padding: 0.8rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid rgba(220, 60, 60, 0.3);
        }
        .offers-table thead th:nth-child(1) { width: 5%; }
        .offers-table thead th:nth-child(2) { width: 55%; }
        .offers-table thead th:nth-child(3) { width: 20%; }
        .offers-table thead th:nth-child(4) { width: 20%; }
        .offers-table tbody tr {
            border-bottom: 1px solid rgba(220, 60, 60, 0.2);
            transition: all 0.3s;
        }
        .offers-table tbody tr:hover {
            background: rgba(220, 60, 60, 0.1);
        }
        .offers-table tbody tr.expired {
            background: rgba(180, 50, 50, 0.15);
        }
        .offers-table tbody td {
            padding: 0.8rem;
            color: #e0e0e0;
        }
        .offer-row {
            cursor: pointer;
        }
        .offer-status {
            text-align: center;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            position: relative;
            cursor: help;
        }
        .status-dot.active { background: #5cb85c; }
        .status-dot.expiring { background: #ffcc00; }
        .status-dot.expired { background: #dc3c3c; }
        .status-dot.future { background: #5dade2; } /* Light blue for future offers */
        .offer-title {
            font-weight: 600;
            color: #e0e0e0;
        }
        .offer-description-row {
            display: none;
            background: rgba(30, 30, 45, 0.5);
        }
        .offer-description-row.expanded {
            display: table-row;
        }
        .offer-description-cell {
            padding: 1rem !important;
            font-style: italic;
            font-size: 0.9rem;
            color: #aaa;
        }
        .offer-actions {
            display: none;
            gap: 0.5rem;
            margin-top: 0.3rem;
        }
        body.edit-mode .offer-actions {
            display: flex;
        }
        .offer-edit-btn, .offer-delete-btn {
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            border: 1px solid;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .offer-edit-btn {
            background: rgba(220, 60, 60, 0.2);
            border-color: #dc3c3c;
            color: #dc3c3c;
        }
        .offer-delete-btn {
            background: rgba(180, 50, 50, 0.2);
            border-color: #b43232;
            color: #b43232;
        }
        .offer-edit-btn:hover { background: rgba(220, 60, 60, 0.3); }
        .offer-delete-btn:hover { background: rgba(180, 50, 50, 0.3); }
        .offers-empty {
            text-align: center;
            padding: 2rem;
            color: #888;
            font-style: italic;
        }
        .offer-link {
            color: #5dade2;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .offer-link:hover {
            color: #dc3c3c;
            text-decoration: underline;
        }
        .active-timers-display {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(40, 40, 60, 0.95);
            border: 1px solid rgba(220, 60, 60, 0.3);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            min-width: 300px;
            max-width: 400px;
            display: none;
            flex-direction: column;
            gap: 0.8rem;
            z-index: 100;
        }
        .active-timers-display.visible {
            display: flex;
        }
        .active-timers-header {
            color: #dc3c3c;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(220, 60, 60, 0.3);
            padding-bottom: 0.5rem;
        }
        .active-timer-item {
            background: rgba(30, 30, 45, 0.8);
            border: 1px solid rgba(220, 60, 60, 0.3);
            border-radius: 8px;
            padding: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .active-timer-info {
            flex: 1;
        }
        .active-timer-type {
            font-size: 0.9rem;
            color: #e0e0e0;
            margin-bottom: 0.2rem;
            font-weight: 600;
        }
        .active-timer-countdown {
            font-size: 1.2rem;
            font-weight: 700;
            color: #5cb85c;
        }
        .active-timer-stop {
            background: rgba(180, 50, 50, 0.2);
            border: 1px solid #b43232;
            color: #b43232;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .active-timer-stop:hover {
            background: rgba(180, 50, 50, 0.4);
        }
        .expired-timers-modal {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            transform: none;
            background: rgba(40, 40, 60, 0.98);
            border: 2px solid #dc3c3c;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 40px rgba(220, 60, 60, 0.4);
            min-width: 400px;
            max-width: 600px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 150;
            margin-bottom: 1rem;
            display: none;
        }
        .expired-timers-modal.visible {
            display: block;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .expired-timers-header {
            color: #dc3c3c;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
        }
        .expired-timer-item {
            background: rgba(220, 60, 60, 0.15);
            border: 1px solid #dc3c3c;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .expired-timer-item:last-child {
            margin-bottom: 0;
        }
        .expired-timer-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #dc3c3c;
            margin-bottom: 0.5rem;
        }
        .expired-timer-description {
            color: #aaa;
            font-style: italic;
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
        }
        .expired-timer-actions {
            display: flex;
            gap: 0.5rem;
        }
        .expired-timer-btn {
            flex: 1;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .restart-expired-btn {
            background: rgba(60, 180, 60, 0.2);
            border-color: #5cb85c;
            color: #5cb85c;
        }
        .restart-expired-btn:hover {
            background: rgba(60, 180, 60, 0.3);
        }
        .dismiss-expired-btn {
            background: rgba(100, 100, 120, 0.3);
            border-color: #666;
            color: #aaa;
        }
        .dismiss-expired-btn:hover {
            background: rgba(100, 100, 120, 0.4);
        }
        .dismiss-all-expired-btn {
            width: 100%;
            margin-top: 1rem;
            padding: 0.8rem;
            background: rgba(180, 50, 50, 0.2);
            border: 1px solid #b43232;
            color: #b43232;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .dismiss-all-expired-btn:hover {
            background: rgba(180, 50, 50, 0.4);
        }
        .files-display-section {
            background: rgba(40, 40, 60, 0.7);
            padding: 1rem;
            border-bottom: 1px solid rgba(220, 60, 60, 0.2);
            min-height: 60px;
        }
        .files-display-section:empty::after {
            content: 'No files uploaded yet';
            color: #888;
            font-size: 0.9rem;
            display: block;
            text-align: center;
        }
        .files-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .bottom-bar { background: rgba(40, 40, 60, 0.9); border-top: 1px solid rgba(220, 60, 60, 0.2); }
        .bottom-bar-header {
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;

/**
 * CONFIG.JS
 * Central configuration file for all modules
 *
 * Purpose: Single source of truth for constants, avoiding magic numbers/strings
 * Used by: All modules
 */

const CONFIG = {
    // LocalStorage keys
    STORAGE_KEYS: {
        NOTES: 'workdesk_notes',
        NOTE_TITLES: 'workdesk_note_titles',
        FILES: 'workdesk_files',
        BUTTONS: 'workdesk_buttons',
        AVG_VALUES: 'workdesk_avg_values',
        OFFERS: 'workdesk_offers'
    },

    // Timer defaults
    TIMER: {
        DEFAULT_COUNTDOWN_MINUTES: 5,
        UPDATE_INTERVAL_MS: 1000,
        NOTIFICATION_DELAY_MS: 2000
    },

    // Calculator defaults
    CALCULATOR: {
        DEFAULT_VALUE: '0',
        MAX_INPUT_LENGTH: 50
    },

    // File upload
    FILES: {
        ACCEPTED_TYPES: ['application/pdf', 'image/png', 'image/jpeg', 'image/jpg'],
        ACCEPTED_EXTENSIONS: ['.pdf', '.png', '.jpg', '.jpeg']
    },

    // Offers status thresholds
    OFFERS: {
        EXPIRING_DAYS_THRESHOLD: 7
    },

    // UI timing
    UI: {
        FOCUS_DELAY_MS: 100,
        CLOCK_UPDATE_INTERVAL_MS: 1000
    }
};
/**
 * STORAGE.JS
 * Data management and localStorage persistence
 *
 * Dependencies: config.js
 * Used by: All modules that need to save/load data
 */

// Global state variables
var notes = [];
var noteTitles = [];
var files = [];
var buttons = [];
var avgValues = [];
var offers = [];
var expandedOffers = [];
var isEditMode = false;

/**
 * Save all data to localStorage
 * Called after any data modification
 */
function saveData() {
    localStorage.setItem(CONFIG.STORAGE_KEYS.NOTES, JSON.stringify(notes));
    localStorage.setItem(CONFIG.STORAGE_KEYS.NOTE_TITLES, JSON.stringify(noteTitles));
    localStorage.setItem(CONFIG.STORAGE_KEYS.FILES, JSON.stringify(files));
    localStorage.setItem(CONFIG.STORAGE_KEYS.BUTTONS, JSON.stringify(buttons));
    localStorage.setItem(CONFIG.STORAGE_KEYS.AVG_VALUES, JSON.stringify(avgValues));
    localStorage.setItem(CONFIG.STORAGE_KEYS.OFFERS, JSON.stringify(offers));
}

/**
 * Load all data from localStorage
 * Called on page init
 */
function loadData() {
    try {
        notes = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.NOTES) || '[]');
        noteTitles = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.NOTE_TITLES) || '[]');
        files = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.FILES) || '[]');
        buttons = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.BUTTONS) || '[]');
        avgValues = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.AVG_VALUES) || '[]');
        offers = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.OFFERS) || '[]');
    } catch (e) {
        notes = [];
        noteTitles = [];
        files = [];
        buttons = [];
        avgValues = [];
        offers = [];
    }
}

function toggleEditMode() {
    isEditMode = !isEditMode;
    var toggle = document.getElementById('editToggle');
    if (isEditMode) {
        document.body.classList.add('edit-mode');
        toggle.classList.add('active');
        toggle.textContent = 'View Mode';
    } else {
        document.body.classList.remove('edit-mode');
        toggle.classList.remove('active');
        toggle.textContent = 'Edit Mode';
    }
    renderOffers();
}
/**
 * UI.JS
 * Modal and UI helper functions
 *
 * Dependencies: calculator.js (for closing calc on modal open)
 * Used by: All modules that show modals
 */

function showModal(title, body) {
    // Close calculator when opening modal
    if (calcActive) {
        toggleCalculator();
    }
    document.getElementById('modalTitleContainer').innerHTML = '<h2 class="modal-title">' + title + '</h2>';

}

function closeModal() {
    document.getElementById('modal').classList.remove('open');
    currentNoteIndex = -1;
}
/**
 * CALCULATOR.JS
 * Calculator widget with keyboard support
 *
 * Dependencies: ui.js (for modal closing)
 * Used by: main.js
 */

var calcActive = false;
var calcCurrentValue = '0';
var calcPreviousValue = '';
var calcOperation = null;
var calcNewNumber = true;
var calcHistory = [];
var calcHistoryVisible = false;

function toggleCalculator() {
    calcActive = !calcActive;
    var calc = document.getElementById('calculator');
    var toggle = document.getElementById('calcToggle');
    if (calcActive) {
        calc.classList.add('active');
        toggle.classList.add('active');
    } else {
        calc.classList.remove('active');
        toggle.classList.remove('active');
    }
}

function updateCalcDisplay() {
    var displayText = calcCurrentValue;
    if (calcOperation && calcPreviousValue) {
        var opSymbol = calcOperation === '*' ? '×' : calcOperation === '-' ? '−' : calcOperation;
        displayText = calcPreviousValue + ' ' + opSymbol + ' ' + (calcNewNumber ? '' : calcCurrentValue);
    }
    document.getElementById('calcDisplay').textContent = displayText;
}

function calcClear() {
    calcCurrentValue = '0';
    calcPreviousValue = '';
    calcOperation = null;
    calcNewNumber = true;
    updateCalcDisplay();
}

function calcBackspace() {
    if (calcCurrentValue.length > 1) {
        calcCurrentValue = calcCurrentValue.slice(0, -1);
    } else {
        calcCurrentValue = '0';
    }
    updateCalcDisplay();
}

function calcInputNumber(num) {
    if (calcNewNumber) {
        calcCurrentValue = num;
        calcNewNumber = false;
    } else {
        if (calcCurrentValue === '0' && num !== '.') {
            calcCurrentValue = num;
        } else {
            if (num === '.' && calcCurrentValue.includes('.')) return;
            calcCurrentValue += num;
        }
    }
    updateCalcDisplay();
}

function calcInputOperator(op) {
    if (calcOperation && !calcNewNumber) {
        calcExecute();
    }
    calcPreviousValue = calcCurrentValue;
    calcOperation = op;
    calcNewNumber = true;
}

function calcExecute() {
    if (!calcOperation || calcPreviousValue === '') return;
    var prev = parseFloat(calcPreviousValue);
    var curr = parseFloat(calcCurrentValue);
    var result = 0;
    var opSymbol = calcOperation === '*' ? '×' : calcOperation === '-' ? '−' : calcOperation;
    switch (calcOperation) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '*': result = prev * curr; break;
        case '/': result = curr !== 0 ? prev / curr : 0; break;
    }

    // Add to history
    var historyEntry = calcPreviousValue + ' ' + opSymbol + ' ' + calcCurrentValue + ' = ' + result;
    calcHistory.unshift(historyEntry);
    if (calcHistory.length > 10) calcHistory.pop(); // Keep only last 10
    updateCalcHistory();

    calcCurrentValue = result.toString();
    calcPreviousValue = '';
    calcOperation = null;
    calcNewNumber = true;
    updateCalcDisplay();
}

function toggleCalcHistory() {
    calcHistoryVisible = !calcHistoryVisible;
    var historyEl = document.getElementById('calcHistory');
    if (calcHistoryVisible) {
        historyEl.style.display = 'block';
    } else {
        historyEl.style.display = 'none';
    }
}

function updateCalcHistory() {
    var historyEl = document.getElementById('calcHistory');
    if (!historyEl) return;
    var html = '';
    calcHistory.forEach(function(entry) {
        html += '<div class="calc-history-item">' + entry + '</div>';
    });
    historyEl.innerHTML = html || '<div class="calc-history-empty">Keine Rechnungen</div>';
}

function handleCalcButton(btn) {
    var text = btn.textContent;
    if (text === 'C') {
        calcClear();
    } else if (text === '⌫') {
        calcBackspace();
    } else if (text === '=') {
        calcExecute();
    } else if (['+', '−', '×', '/'].includes(text)) {
        var op = text === '×' ? '*' : text === '−' ? '-' : text;
        calcInputOperator(op);
    } else {
        calcInputNumber(text);
    }
}

function setupCalculator() {
    var calcButtons = document.querySelectorAll('.calc-btn');
    calcButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
            handleCalcButton(btn);
        });
    });

    document.addEventListener('keydown', function(e) {
        if (!calcActive) return;

        var key = e.key;
        if (key >= '0' && key <= '9') {
            calcInputNumber(key);
            e.preventDefault();
        } else if (key === '.') {
            calcInputNumber('.');
            e.preventDefault();
        } else if (key === '+' || key === '-' || key === '*' || key === '/') {
            calcInputOperator(key);
            e.preventDefault();
        } else if (key === 'Enter' || key === '=') {
            calcExecute();
            e.preventDefault();
        } else if (key === 'Escape' || key === 'c' || key === 'C') {
            calcClear();
            e.preventDefault();
        } else if (key === 'Backspace') {
            calcBackspace();
            e.preventDefault();
        }
    });
}
/**
 * DATECALCULATOR.JS
 * Date difference calculator - calculates days, weeks, months, years between dates
 *
 * Dependencies: ui.js (showModal, closeModal)
 * Used by: main.js
 */

function openDateCalcModal() {
    showModal('Datumsrechner',
        '<div class="form-group"><label class="form-label">Zieldatum</label>' +
        '<input type="date" class="form-input" id="targetDate"></div>' +
        '<div id="dateCalcResults"></div>' +
        '<div class="modal-actions">' +
        '<button class="action-button save-button" id="calcDateBtn">Berechnen</button>' +
        '<button class="action-button cancel-button" onclick="closeModal()">Schließen</button>' +
        '</div>'
    );
    document.getElementById('calcDateBtn').onclick = calculateDateDifference;
    setTimeout(function() {
        var targetDate = document.getElementById('targetDate');
        targetDate.focus();
        targetDate.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                calculateDateDifference();
            }
        });
    }, CONFIG.UI.FOCUS_DELAY_MS);
}

function calculateDateDifference() {
    var targetDateInput = document.getElementById('targetDate').value;
    if (!targetDateInput) {
        alert('Bitte geben Sie ein Zieldatum ein');
        return;
    }

    var now = new Date();
    now.setHours(0, 0, 0, 0);
    var target = new Date(targetDateInput);
    target.setHours(0, 0, 0, 0);

    var diffTime = target - now;
    var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    var diffWeeks = Math.floor(Math.abs(diffDays) / 7);

    var isPast = diffTime < 0;
    var startDate = isPast ? target : now;
    var endDate = isPast ? now : target;

    // Calculate years, months, weeks, days
    var years = 0;
    var months = 0;
    var tempDate = new Date(startDate);

    // Count full years
    while (tempDate.getFullYear() < endDate.getFullYear() ||
           (tempDate.getFullYear() === endDate.getFullYear() &&
            (tempDate.getMonth() < endDate.getMonth() ||
             (tempDate.getMonth() === endDate.getMonth() && tempDate.getDate() <= endDate.getDate())))) {
        var nextYear = new Date(tempDate);
        nextYear.setFullYear(nextYear.getFullYear() + 1);
        if (nextYear <= endDate) {
            years++;
            tempDate = nextYear;
        } else {
            break;
        }
    }

    // Count remaining months
    while (tempDate.getMonth() < endDate.getMonth() ||
           (tempDate.getMonth() === endDate.getMonth() && tempDate.getDate() <= endDate.getDate()) ||
           (tempDate.getMonth() > endDate.getMonth() && tempDate < endDate)) {
        var nextMonth = new Date(tempDate);
        nextMonth.setMonth(nextMonth.getMonth() + 1);
        if (nextMonth <= endDate) {
            months++;
            tempDate = nextMonth;
        } else {
            break;
        }
    }

    // Calculate remaining days and weeks
    var remainingDays = Math.ceil((endDate - tempDate) / (1000 * 60 * 60 * 24));
    var remainingWeeks = Math.floor(remainingDays / 7);
    remainingDays = remainingDays % 7;

    var prefix = isPast ? 'vor ' : 'in ';
    var absDays = Math.abs(diffDays);
    var absWeeks = diffWeeks;

    var resultsHtml = '<div class="date-calc-result">';
    resultsHtml += '<div class="date-calc-row"><span class="date-calc-label">Tage</span><span class="date-calc-value">' + prefix + absDays + ' Tagen</span></div>';
    resultsHtml += '<div class="date-calc-row"><span class="date-calc-label">Wochen</span><span class="date-calc-value">' + prefix + absWeeks + ' Wochen</span></div>';

    // Build combined display with years
    var combinedParts = [];
    if (years > 0) combinedParts.push(years + ' Jahr' + (years !== 1 ? 'e' : ''));
    if (months > 0) combinedParts.push(months + ' Monat' + (months !== 1 ? 'e' : ''));
    if (remainingWeeks > 0) combinedParts.push(remainingWeeks + ' Woche' + (remainingWeeks !== 1 ? 'n' : ''));
    if (remainingDays > 0) combinedParts.push(remainingDays + ' Tag' + (remainingDays !== 1 ? 'e' : ''));

    var combinedText = combinedParts.length > 0 ? prefix + combinedParts.join(', ') : 'Heute';

    resultsHtml += '<div class="date-calc-row"><span class="date-calc-label">Kombiniert</span><span class="date-calc-value">' + combinedText + '</span></div>';
    resultsHtml += '</div>';

    document.getElementById('dateCalcResults').innerHTML = resultsHtml;
}

    var sum = avgValues.reduce(function(acc, val) { return acc + val; }, 0);

/**
 * TIMER-NOTIFICATIONS.JS
 * Handles browser notifications for timers
 *
 * Dependencies: None
 * Used by: timer-core.js
 */

var notificationAsked = false;

function requestNotification() {
    if (notificationAsked) return;
    if ("Notification" in window && Notification.permission === "default") {
        notificationAsked = true;
        Notification.requestPermission().then(function(permission) {
            if (permission === "granted") {
                console.log('Notifications enabled!');
            }
        });
    }
}

function showNotification(title, body) {
    console.log('Trying to show notification:', title, body);
    console.log('Notification permission:', Notification.permission);

    if ("Notification" in window) {
        if (Notification.permission === "granted") {
            try {
                var notification = new Notification(title, {
                    body: body,
                    requireInteraction: true,
                    tag: 'timer-' + Date.now()
                });
                console.log('Notification created successfully');
            } catch (e) {
                console.error('Notification error:', e);
            }
        } else if (Notification.permission === "default") {
            console.log('Notification permission not granted yet');
        } else {
            console.log('Notification permission denied');
        }
    } else {
        console.log('Notifications not supported in this browser');
    }
}
/**
 * TIMER-CORE.JS
 * Core timer logic - start, stop, update, countdown
 *
 * Dependencies: timer-notifications.js, timer-ui.js
 * Used by: timer-ui.js, main.js
 */

var activeTimers = [];
var expiredTimers = [];
var timerIntervals = {};
var timerIdCounter = 0;
var lastTimerConfig = null;
var timeVisible = true;

// Clock functions
function updateClock() {
    if (!timeVisible) return;
    var now = new Date();
    document.getElementById('dashTime').textContent = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
    });
    document.getElementById('dashDate').textContent = now.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
}

function toggleTimeVisibility() {
    timeVisible = !timeVisible;
    var timeEl = document.getElementById('dashTime');
    if (timeVisible) {
        timeEl.classList.remove('hidden');
        updateClock();
    } else {
        timeEl.classList.add('hidden');
        timeEl.textContent = '--:--:--';
    }
}

// Timer countdown logic
function updateTimerCountdown(timerId) {
    var timer = activeTimers.find(function(t) { return t.id === timerId; });
    if (!timer) return;

    var now = new Date();
    var countdownEl = document.getElementById('timer-countdown-' + timerId);
    if (!countdownEl) return;

    if (timer.type === 'countdown') {
        var elapsed = Math.floor((now - timer.start) / 1000);
        var remaining = timer.duration - elapsed;

        if (remaining <= 0) {
            var notifBody = timer.description || 'Dein Countdown-Timer ist abgelaufen.';
            showNotification(timer.title, notifBody);

            expiredTimers.push(timer);
            stopTimer(timerId);
            updateExpiredTimersDisplay();
            return;
        }

        var h = Math.floor(remaining / 3600);
        var m = Math.floor((remaining % 3600) / 60);
        var s = remaining % 60;
        countdownEl.textContent = h.toString().padStart(2, '0') + ':' +
                                 m.toString().padStart(2, '0') + ':' +
                                 s.toString().padStart(2, '0');
    } else if (timer.type === 'alarm') {
        var target = new Date(timer.target);
        if (now >= target) {
            var notifBody = timer.description || 'Deine Alarmzeit wurde erreicht.';
            showNotification(timer.title, notifBody);

            expiredTimers.push(timer);
            stopTimer(timerId);
            updateExpiredTimersDisplay();
            return;
        }

        var diff = Math.floor((target - now) / 1000);
        var h = Math.floor(diff / 3600);
        var m = Math.floor((diff % 3600) / 60);
        var s = diff % 60;
        countdownEl.textContent = h.toString().padStart(2, '0') + ':' +
                                 m.toString().padStart(2, '0') + ':' +
                                 s.toString().padStart(2, '0');
    }
}

// Timer start/stop
function startTimer(type, value, title, description) {
    var timerId = timerIdCounter++;
    var timer = {
        id: timerId,
        type: type,
        title: title || (type === 'countdown' ? 'Countdown' : 'Alarm'),
        description: description || ''
    };

    if (type === 'countdown') {
        var parts = value.split(':');
        var hours = parseInt(parts[0]) || 0;
        var minutes = parseInt(parts[1]) || 0;
        var seconds = parseInt(parts[2]) || 0;
        timer.duration = hours * 3600 + minutes * 60 + seconds;
        timer.start = new Date();
    } else {
        timer.target = value;
    }

    activeTimers.push(timer);

    timerIntervals[timerId] = setInterval(function() {
        updateTimerCountdown(timerId);
    }, CONFIG.TIMER.UPDATE_INTERVAL_MS);

    updateActiveTimersDisplay();
    updateTimerCountdown(timerId);

    var notifTitle = timer.title;
    var notifBody = timer.description ? timer.description : (type === 'countdown' ? 'Countdown-Timer gestartet' : 'Alarm gesetzt');
    showNotification(notifTitle, notifBody);
    requestNotification();

    lastTimerConfig = { type: type, value: value, title: title, description: description };
}

function stopTimer(timerId) {
    if (timerIntervals[timerId]) {
        clearInterval(timerIntervals[timerId]);
        delete timerIntervals[timerId];
    }

    activeTimers = activeTimers.filter(function(t) { return t.id !== timerId; });
    updateActiveTimersDisplay();
}

// Expired timer management
function restartExpiredTimer(index) {
    var timer = expiredTimers[index];
    if (timer.type === 'countdown') {
        var h = Math.floor(timer.duration / 3600);
        var m = Math.floor((timer.duration % 3600) / 60);
        var s = timer.duration % 60;
        startTimer('countdown', h + ':' + m + ':' + s, timer.title, timer.description);
    } else {
        startTimer('alarm', timer.target, timer.title, timer.description);
    }
    dismissExpiredTimer(index);
}

function dismissExpiredTimer(index) {
    expiredTimers.splice(index, 1);
    updateExpiredTimersDisplay();
}

function dismissAllExpiredTimers() {
    expiredTimers = [];
    updateExpiredTimersDisplay();
}

/**
 * OFFERS.JS
 * Offers/Angebote tracking with status indicators (active, expiring, expired, future)
 *
 * Dependencies: ui.js, storage.js, config.js
 * Used by: main.js
 */

function getOfferStatus(offer) {
    var now = new Date();
    now.setHours(0, 0, 0, 0);
    var endDate = new Date(offer.end);
    endDate.setHours(0, 0, 0, 0);
    var startDate = new Date(offer.start);
    startDate.setHours(0, 0, 0, 0);

    // Check if offer hasn't started yet (future offer)
    if (now < startDate) {
        return { status: 'future', text: 'Angebot bald verfügbar' };
    }

    var diffTime = endDate - now;
    var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays < 0) {
        return { status: 'expired', text: 'Angebot ist abgelaufen' };
    } else if (diffDays <= CONFIG.OFFERS.EXPIRING_DAYS_THRESHOLD) {
        return { status: 'expiring', text: 'Angebot läuft innerhalb der nächsten ' + CONFIG.OFFERS.EXPIRING_DAYS_THRESHOLD + ' Tage ab' };
    } else {
        return { status: 'active', text: 'Aktives Angebot' };
    }
}

function renderOffers() {
    var container = document.getElementById('offersTableContainer');
    var addBtn = document.getElementById('addOfferBtn');

    if (offers.length === 0) {
        container.innerHTML = '<div class="offers-empty">Keine Angebote vorhanden. Klicken Sie auf "+ Angebot" um ein neues Angebot hinzuzufügen.</div>';
        addBtn.classList.add('show-always');
        return;
    }

    addBtn.classList.remove('show-always');

    var tableHtml = '<table class="offers-table"><thead><tr><th>Status</th><th>Angebot</th><th>Beginn</th><th>Ende</th></tr></thead><tbody>';

    offers.forEach(function(offer, index) {
        var isExpanded = expandedOffers.indexOf(index) !== -1;
        var formattedStart = formatDate(offer.start);
        var formattedEnd = formatDate(offer.end);
        var status = getOfferStatus(offer);

        var rowClass = 'offer-row';
        if (status.status === 'expired') {
            rowClass += ' expired';
        }

        tableHtml += '<tr class="' + rowClass + '" onclick="toggleOfferDescription(' + index + ')">';
        tableHtml += '<td class="offer-status"><span class="status-dot ' + status.status + '" title="' + status.text + '"></span></td>';
        tableHtml += '<td><span class="offer-title">' + offer.title + '</span>';
        if (isEditMode) {
            tableHtml += '<div class="offer-actions" onclick="event.stopPropagation()">';
            tableHtml += '<button class="offer-edit-btn" onclick="editOffer(' + index + ')">Bearbeiten</button>';
            tableHtml += '<button class="offer-delete-btn" onclick="deleteOffer(' + index + ')">Löschen</button>';
            tableHtml += '</div>';
        }
        tableHtml += '</td>';
        tableHtml += '<td>' + formattedStart + '</td>';
        tableHtml += '<td>' + formattedEnd + '</td>';
        tableHtml += '</tr>';

        if (offer.description || offer.url) {
            var descContent = offer.description || '';
            if (offer.url) {
                descContent += (descContent ? '<br><br>' : '') + '🔗 <a href="' + offer.url + '" target="_blank" class="offer-link" onclick="event.stopPropagation()">' + offer.url + '</a>';
            }
            tableHtml += '<tr class="offer-description-row' + (isExpanded ? ' expanded' : '') + '">';
            tableHtml += '<td colspan="4" class="offer-description-cell">' + descContent + '</td>';
            tableHtml += '</tr>';
        }
    });

    tableHtml += '</tbody></table>';
    container.innerHTML = tableHtml;
}

function formatDate(dateString) {
    if (!dateString) return '';
    var date = new Date(dateString);
    var day = date.getDate().toString().padStart(2, '0');
    var month = (date.getMonth() + 1).toString().padStart(2, '0');
    var year = date.getFullYear();
    return day + '.' + month + '.' + year;
}

 * NOTES.JS
 * Notes management - create, edit, delete, drag-and-drop reordering
 *

 */

var currentNoteIndex = -1;
var draggedNoteIndex = null;

function createNote() {
    var content = document.getElementById('noteInput').value.trim();
    if (!content) {
        alert('Please enter some text for your note');
        return;
    }
    notes.push(content);
    noteTitles.push('Note #' + notes.length);
    document.getElementById('noteInput').value = '';
    saveData();
    renderNotes();
}

function renderNotes() {
    var notesBar = document.getElementById('notesBar');
    notesBar.innerHTML = '';
    notes.forEach(function(note, index) {
        var wrapper = document.createElement('div');
        wrapper.className = 'note-button-container';
        wrapper.dataset.index = index;
        wrapper.draggable = true;

        wrapper.ondragstart = function(e) {
            draggedNoteIndex = parseInt(this.dataset.index);
            this.style.opacity = '0.4';
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', 'note');
        };

        wrapper.ondragend = function(e) {
            this.style.opacity = '1';
            this.style.borderLeft = '';
        };

        wrapper.ondragover = function(e) {
            if (draggedNoteIndex === null) return;
            if (e.preventDefault) e.preventDefault();
            this.style.borderLeft = '3px solid #dc3c3c';
            return false;
        };

        wrapper.ondragleave = function(e) {
            this.style.borderLeft = '';
        };

        wrapper.ondrop = function(e) {
            if (draggedNoteIndex === null) return false;
            if (e.stopPropagation) e.stopPropagation();
            this.style.borderLeft = '';

            var dropIndex = parseInt(this.dataset.index);
            if (draggedNoteIndex !== dropIndex) {
                // Swap positions
                var tempNote = notes[draggedNoteIndex];
                var tempTitle = noteTitles[draggedNoteIndex];

                notes[draggedNoteIndex] = notes[dropIndex];
                noteTitles[draggedNoteIndex] = noteTitles[dropIndex];

                notes[dropIndex] = tempNote;
                noteTitles[dropIndex] = tempTitle;

                saveData();
                renderNotes();
            }
            draggedNoteIndex = null;
            return false;
        };

        var button = document.createElement('button');
        button.className = 'note-button';
        button.textContent = noteTitles[index] || ('Note #' + (index + 1));
        button.onclick = function(e) {
            if (!e.target.classList.contains('note-delete-btn')) {
                openNote(parseInt(wrapper.dataset.index));
            }
        };

        // Delete button for notes in edit mode
        var deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn note-delete-btn';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.onclick = function(e) {
            e.stopPropagation();
            var idx = parseInt(wrapper.dataset.index);
            if (confirm('Diese Notiz löschen?')) {
                notes.splice(idx, 1);
                noteTitles.splice(idx, 1);
                saveData();
                renderNotes();
            }
        };

        wrapper.appendChild(button);
        wrapper.appendChild(deleteBtn);
        notesBar.appendChild(wrapper);
    });
}

    currentNoteIndex = index;
    showModal(noteTitles[index] || ('Note #' + (index + 1)),

/**
 * FILES.JS
 * File upload and management - PDF, PNG, JPG with drag-and-drop
 *
 * Dependencies: storage.js, config.js
 * Used by: main.js
 */

function renderFiles() {
    var filesDisplay = document.getElementById('filesDisplay');
    filesDisplay.innerHTML = '';
    if (files.length === 0) return;
    var filesList = document.createElement('div');
    filesList.className = 'files-list';
    files.forEach(function(file, index) {
        var wrapper = document.createElement('div');
        wrapper.className = 'file-item-container';
        var fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        var icon = file.type === 'application/pdf' ? '[PDF]' : '[IMG]';
        fileItem.textContent = icon + ' ' + file.name;
        fileItem.onclick = function() { if (!isEditMode) openFile(file); };
        var deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.onclick = function(e) {
            e.stopPropagation();
            deleteFile(index);
        };
        wrapper.appendChild(fileItem);
        wrapper.appendChild(deleteBtn);
        filesList.appendChild(wrapper);
    });
    filesDisplay.appendChild(filesList);
}

function openFile(file) {
    var newWindow = window.open();
    if (file.type === 'application/pdf') {
        newWindow.document.write('<iframe width="100%" height="100%" src="' + file.data + '"></iframe>');
    } else {
        newWindow.document.write('<img src="' + file.data + '" style="max-width:100%;"/>');
    }
}

function deleteFile(index) {
    if (confirm('Delete this file?')) {
        files.splice(index, 1);
        saveData();
        renderFiles();
    }
}

function handleFiles(fileList) {
    Array.from(fileList).forEach(function(file) {
        if (file.type === 'application/pdf' || file.type === 'image/png' || file.type === 'image/jpeg' || file.type === 'image/jpg') {
            var reader = new FileReader();
            reader.onload = function(e) {
                files.push({ name: file.name, data: e.target.result, type: file.type });
                saveData();
                renderFiles();
            };
            reader.readAsDataURL(file);
        }
    });
}

function setupDragAndDrop() {
    var uploadArea = document.getElementById('uploadArea');
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function(eventName) {
        uploadArea.addEventListener(eventName, function(e) {
            e.preventDefault();
            e.stopPropagation();
        }, false);
    });
    ['dragenter', 'dragover'].forEach(function(eventName) {
        uploadArea.addEventListener(eventName, function() {
            uploadArea.classList.add('drag-over');
        }, false);
    });
    ['dragleave', 'drop'].forEach(function(eventName) {
        uploadArea.addEventListener(eventName, function() {
            uploadArea.classList.remove('drag-over');
        }, false);
    });
    uploadArea.addEventListener('drop', function(e) {
        handleFiles(e.dataTransfer.files);
    }, false);
}

function toggleUpload() {
    var section = document.getElementById('uploadSection');
    var arrow = document.getElementById('uploadArrow');
    section.classList.toggle('open');
    arrow.classList.toggle('up');
}

    renderNotes();
    renderFiles();
    renderOffers();
    updateClock();
    setInterval(updateClock, 1000);
    requestNotification();

    // Request notification permission on load
    if ("Notification" in window && Notification.permission === "default") {
        setTimeout(function() {
            Notification.requestPermission();
        }, 2000);
    }
});
    </script>
